<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GoldenLink 브로슈어</title>
<meta property="og:title" content="GoldenLink 브로슈어">
<meta property="og:image" content="front.jpg">
<style>
  :root{--bg:#1f2833;--fg:#f4efe6;--accent:#c39257;--hdr:52px;--ratio:.4718}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;height:var(--hdr);padding:0 16px;position:sticky;top:0;background:rgba(31,40,51,.92);backdrop-filter:blur(8px);z-index:2}
  header b{letter-spacing:.2em;font-size:13px}
  header a{color:var(--bg);background:var(--accent);text-decoration:none;font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;white-space:nowrap}
  .sheet{display:block;width:100%;height:auto}
  .label{font-size:12px;letter-spacing:.15em;opacity:.55;padding:20px 16px 8px}
  .note{font-size:12px;opacity:.6;text-align:center;padding:16px}
  .pager-wrap{display:none}
  /* 휴대폰 세로: 6칸을 옆으로 넘기는 슬라이드 */
  @media (orientation:portrait) and (max-width:900px){
    html,body{height:100%;overflow:hidden}
    .wide{display:none}
    .pager-wrap{display:flex;flex-direction:column;height:calc(100dvh - var(--hdr))}
    .pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
    .pager::-webkit-scrollbar{display:none}
    .slide{flex:0 0 100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;padding:8px 0}
    .panel{width:min(calc(100vw - 16px),calc((100dvh - var(--hdr) - 16px) * var(--ratio)));aspect-ratio:857.67/1818;background-size:300% 100%;background-repeat:no-repeat;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.45);will-change:transform,opacity;transform-origin:center}
    .f{background-image:url(front.jpg)}.b{background-image:url(back.jpg)}
    .c0{background-position:0 0}.c1{background-position:50% 0}.c2{background-position:100% 0}
  }
  @media (prefers-reduced-motion:reduce){.pager{scroll-behavior:auto}}
</style>
</head>
<body>
<header><b>GOLDENLINK</b><a href="goldenlink-brochure-ko.pdf" download>PDF 받기</a></header>
<div class="wide">
  <div class="label">앞면</div><img class="sheet" src="front.jpg" alt="GoldenLink 브로슈어 — 앞면">
  <div class="label">뒷면</div><img class="sheet" src="back.jpg" alt="GoldenLink 브로슈어 — 뒷면">
  <p class="note">가로 화면에서는 원본 배치로 보여요</p>
</div>
<div class="pager-wrap">
  <!-- 읽는 순서: 표지 → 안쪽 01·02·03 → 기술 상세 → 사업 소개·연락처 -->
  <div class="pager" id="pager" aria-label="GoldenLink 브로슈어">
    <div class="slide"><div class="panel f c2"></div></div>
    <div class="slide"><div class="panel b c0"></div></div>
    <div class="slide"><div class="panel b c1"></div></div>
    <div class="slide"><div class="panel b c2"></div></div>
    <div class="slide"><div class="panel f c0"></div></div>
    <div class="slide"><div class="panel f c1"></div></div>
  </div>
</div>
<script>
(() => {
  const pager = document.getElementById('pager');
  const slides = [...pager.children], panels = slides.map(s => s.firstElementChild);
  const go = i => pager.scrollTo({ left: Math.max(0, Math.min(slides.length - 1, i)) * pager.clientWidth, behavior: 'smooth' });
  let raf = 0, cur = -1;
  // 넘기는 동안: 가운데에서 멀어질수록 살짝 작아지고 흐려진다
  const paint = () => {
    raf = 0;
    const w = pager.clientWidth || 1, pos = pager.scrollLeft / w;
    panels.forEach((p, i) => { const d = Math.min(1, Math.abs(i - pos)); p.style.transform = 'scale(' + (1 - .08 * d) + ')'; p.style.opacity = 1 - .45 * d; });
    cur = Math.round(pos);
  };
  pager.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(paint); }, { passive: true });
  addEventListener('resize', paint);
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
  paint();
})();
</script>
</body>
</html>
