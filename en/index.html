<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoldenLink Brochure</title>
<meta property="og:title" content="GoldenLink Brochure">
<meta property="og:image" content="front.jpg">
<style>
  :root{--bg:#1f2833;--fg:#f4efe6;--accent:#c39257}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;background:rgba(31,40,51,.92);backdrop-filter:blur(8px);z-index:2}
  header b{letter-spacing:.2em;font-size:13px}
  header a{color:var(--bg);background:var(--accent);text-decoration:none;font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;white-space:nowrap}
  main{padding:0 0 32px}
  .sheet{display:block;width:100%;height:auto}
  .sheet+.label+.sheet{margin-top:0}
  .label{font-size:12px;letter-spacing:.15em;opacity:.55;padding:20px 16px 8px}
  .panels{display:none}
  /* 3단 접지 한 칸 = 시트 가로의 1/3 */
  .panel{width:100%;aspect-ratio:857.67/1818;background-size:300% 100%;background-repeat:no-repeat}
  .panel+.panel{margin-top:10px}
  .f{background-image:url(front.jpg)}.b{background-image:url(back.jpg)}
  .c0{background-position:0 0}.c1{background-position:50% 0}.c2{background-position:100% 0}
  .note{font-size:12px;opacity:.6;text-align:center;padding:16px}
  @media (orientation:portrait) and (max-width:900px){.wide{display:none}.panels{display:block}}
</style>
</head>
<body>
<header><b>GOLDENLINK</b><a href="goldenlink-brochure-en.pdf" download>Download PDF</a></header>
<main>
  <div class="wide">
    <div class="label">FRONT</div><img class="sheet" src="front.jpg" alt="GoldenLink Brochure — FRONT">
    <div class="label">BACK</div><img class="sheet" src="back.jpg" alt="GoldenLink Brochure — BACK">
  </div>
  <!-- 휴대폰 세로: 표지 → 안쪽 01·02·03 → 기술 상세 → 사업 소개·연락처 -->
  <div class="panels" role="img" aria-label="GoldenLink Brochure">
    <div class="panel f c2"></div>
    <div class="panel b c0"></div>
    <div class="panel b c1"></div>
    <div class="panel b c2"></div>
    <div class="panel f c0"></div>
    <div class="panel f c1"></div>
  </div>
  <p class="note">Pinch to zoom · Rotate to landscape for the original layout</p>
</main>
</body>
</html>
